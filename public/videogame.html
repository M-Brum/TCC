<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Videogame - InterHub</title>
    <link rel="stylesheet" href="/style.css">

    <style>
        .jogos-lista {
            display: grid;
            gap: 15px;
        }

        .jogo-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .08);
            border-left: 5px solid #fca311;
        }

        .confronto {
            font-size: 18px;
            font-weight: bold;
            color: #1b263b;
            text-align: center;
        }

        .placar {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #fca311;
            margin: 12px 0;
        }

        .vencedor {
            color: #16803c;
            font-size: 22px;
        }

        .resultado-indisponivel {
            color: #777;
            font-size: 18px;
        }

        .detalhes {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            color: #555;
        }

        .status {
            font-weight: bold;
        }

        .finalizado {
            color: #16803c;
        }

        .agendado {
            color: #a66b00;
        }

        .em-andamento {
            color: #1565c0;
        }

        .mensagem {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            background: #fca311;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            color: black;
        }
    </style>
</head>

<body>

    <header>
        <h1>Interclasse 2026</h1>
        <span>Escola Exército Brasileiro</span>
    </header>

    <section class="hero">
        <h2>🎮 VIDEOGAME</h2>
        <p>Jogos da modalidade</p>
    </section>

    <section class="container">

        <div class="highlight">
            <h2>Jogos de Videogame</h2>

            <div class="jogos-lista" id="lista-jogos">
                <p class="mensagem">Carregando jogos...</p>
            </div>

            <a href="jogos.html" class="voltar">⬅ Voltar</a>
        </div>

    </section>

    <footer>
        Equipe 3°C
    </footer>

    <script>
        async function carregarJogos() {

            const lista = document.getElementById("lista-jogos");

            try {

                const resposta = await fetch("/api/jogos?modalidade=Videogame");

                if (!resposta.ok) {
                    throw new Error("Não foi possível carregar os jogos.");
                }

                const jogos = await resposta.json();

                lista.innerHTML = "";

                if (jogos.length === 0) {
                    lista.innerHTML = `
                        <p class="mensagem">
                            Nenhum jogo de Videogame cadastrado ainda.
                        </p>
                    `;
                    return;
                }

                jogos.forEach(jogo => {

                    const card = document.createElement("div");
                    card.classList.add("jogo-card");

                    // Confronto
                    const confronto = document.createElement("div");
                    confronto.classList.add("confronto");
                    confronto.textContent = `${jogo.time1} x ${jogo.time2}`;

                    const status = jogo.status || "Agendado";

                    // Resultado da partida
                    const placar = document.createElement("div");
                    placar.classList.add("placar");

                    if (status === "Finalizado") {

                        // Utiliza os campos de resultado, com fallback para os gols.
                        const resultado1 = Number(
                            jogo.resultado_time1 ?? jogo.gols_time1
                        );

                        const resultado2 = Number(
                            jogo.resultado_time2 ?? jogo.gols_time2
                        );

                        if (resultado1 > resultado2) {

                            placar.textContent = `🏆 Vencedor: ${jogo.time1}`;
                            placar.classList.add("vencedor");

                        } else if (resultado2 > resultado1) {

                            placar.textContent = `🏆 Vencedor: ${jogo.time2}`;
                            placar.classList.add("vencedor");

                        } else {

                            placar.textContent = "Resultado não disponível";
                            placar.classList.add("resultado-indisponivel");

                        }

                    } else if (status === "Em andamento") {

                        placar.textContent = "Partida em andamento";
                        placar.classList.add("em-andamento");

                    } else {

                        placar.textContent = "Aguardando jogo";

                    }

                    // Data
                    const data = jogo.data_jogo
                        ? String(jogo.data_jogo)
                            .split("T")[0]
                            .split("-")
                            .reverse()
                            .join("/")
                        : "A definir";

                    // Horário
                    const horario = jogo.horario
                        ? String(jogo.horario).slice(0, 5)
                        : "A definir";

                    // Detalhes
                    const detalhes = document.createElement("div");
                    detalhes.classList.add("detalhes");

                    const dataHorario = document.createElement("span");
                    dataHorario.textContent = `📅 ${data} | 🕒 ${horario}`;

                    const situacao = document.createElement("span");
                    situacao.classList.add("status");

                    if (status === "Finalizado") {
                        situacao.classList.add("finalizado");
                    } else if (status === "Em andamento") {
                        situacao.classList.add("em-andamento");
                    } else {
                        situacao.classList.add("agendado");
                    }

                    situacao.textContent = status;

                    detalhes.appendChild(dataHorario);
                    detalhes.appendChild(situacao);

                    // Montagem do card
                    card.appendChild(confronto);
                    card.appendChild(placar);
                    card.appendChild(detalhes);

                    lista.appendChild(card);

                });

            } catch (erro) {

                console.error("Erro ao carregar jogos:", erro);

                lista.innerHTML = `
                    <p class="mensagem">
                        Erro ao carregar os jogos de Videogame.
                    </p>
                `;
            }
        }

        carregarJogos();

        // Atualiza os jogos automaticamente a cada 10 segundos
        setInterval(() => {
            if (!document.hidden) {
                carregarJogos();
            }
        }, 10000);
    </script>

</body>
</html>
