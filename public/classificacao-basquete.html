<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classificação - Basquete</title>

    <link rel="stylesheet" href="/style.css">

    <style>

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,.15);
        }

        th {
            background: #0d1b2a;
            color: white;
            padding: 15px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .mensagem {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,.10);
        }

        .voltar {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            background: #fca311;
            color: #111;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<header>

    <h1>Interclasse 2026</h1>

    <span>Escola Exército Brasileiro</span>

</header>

<section class="hero">

    <h2>🏀 BASQUETE</h2>

    <p>Classificação</p>

</section>

<section class="container">

    <table>

        <thead>

            <tr>
                <th>Pos</th>
                <th>Time</th>
                <th>P</th>
                <th>V</th>
                <th>E</th>
                <th>D</th>
            </tr>

        </thead>

        <tbody id="tabelaClassificacao"></tbody>

    </table>

    <div
        id="mensagem"
        class="mensagem"
        style="display:none;"
    >

        🏆 Nenhum time de Basquete cadastrado ainda.

    </div>

    <a href="/classificacao.html" class="voltar">

        ⬅ Voltar para modalidades

    </a>

</section>

<footer>

    InterHub © 2026

</footer>

<script>

async function carregarClassificacao() {

    try {

        const resposta =
            await fetch("/api/classificacao");

        if (!resposta.ok) {

            throw new Error(
                "Erro ao buscar classificação."
            );

        }

        const times =
            await resposta.json();

        const tabela =
            document.getElementById(
                "tabelaClassificacao"
            );

        const mensagem =
            document.getElementById(
                "mensagem"
            );

        const basquete =
            times.filter(
                time =>
                    time.modalidade
                    .toLowerCase()
                    === "basquete"
            );

        tabela.innerHTML = "";

        if (basquete.length === 0) {

            mensagem.style.display = "block";

            return;

        }

        mensagem.style.display = "none";

        basquete.forEach(
            (time, index) => {

                const linha =
                    document.createElement("tr");

                linha.innerHTML = `

                    <td>${index + 1}°</td>

                    <td>${time.time}</td>

                    <td>${time.pontos}</td>

                    <td>${time.vitorias}</td>

                    <td>${time.empates}</td>

                    <td>${time.derrotas}</td>

                `;

                tabela.appendChild(linha);

            }
        );

    }

    catch (erro) {

        console.error(erro);

        document.getElementById(
            "mensagem"
        ).style.display = "block";

        document.getElementById(
            "mensagem"
        ).textContent =
            "❌ Não foi possível carregar a classificação.";

    }

}

carregarClassificacao();

</script>

</body>

</html>
