<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tabela - Vôlei | InterHub</title>

    <link rel="stylesheet" href="/style.css">

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,.15);
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            background: #0d1b2a;
            color: white;
            padding: 15px;
        }

        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f5f5;
        }

        @media (max-width: 600px) {
            .container {
                overflow-x: auto;
            }

            table {
                min-width: 550px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Interclasse 2026</h1>
        <span>Escola Exército Brasileiro</span>
    </header>
    <a href="/index.html" class="botao-inicio">🏠 Início</a>
    <section class="hero">
        <h2>🏐 VÔLEI</h2>
        <p>Tabela de Jogos</p>
    </section>

    <section class="container">

        <table>
            <thead>
                <tr>
                    <th>Rodada</th>
                    <th>Confronto</th>
                    <th>Data</th>
                    <th>Horário</th>
                    <th>Resultado</th>
                </tr>
            </thead>

            <tbody id="tabela-jogos">
                <tr>
                    <td colspan="5">Carregando jogos...</td>
                </tr>
            </tbody>
        </table>

    </section>

    <footer>
        InterHub © 2026
    </footer>

    <script>
        async function carregarJogos() {

            const tabela = document.getElementById("tabela-jogos");

            try {
                const resposta = await fetch("/api/jogos?modalidade=Vôlei");

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar jogos.");
                }

                const jogos = await resposta.json();

                tabela.innerHTML = "";

                if (jogos.length === 0) {
                    tabela.innerHTML = `
                        <tr>
                            <td colspan="5">
                                Nenhum jogo cadastrado no Vôlei.
                            </td>
                        </tr>
                    `;
                    return;
                }

                jogos.forEach(jogo => {

                    const linha = document.createElement("tr");

                    const rodada = document.createElement("td");
                    rodada.textContent = "—";

                    const confronto = document.createElement("td");
                    confronto.textContent = `${jogo.time1} x ${jogo.time2}`;

                    const data = document.createElement("td");

                    data.textContent = jogo.data_jogo
                        ? String(jogo.data_jogo)
                            .split("T")[0]
                            .split("-")
                            .reverse()
                            .join("/")
                        : "A definir";

                    const horario = document.createElement("td");

                    horario.textContent = jogo.horario
                        ? String(jogo.horario).slice(0, 5)
                        : "A definir";

                    const resultado = document.createElement("td");

                    const gols1 = Number(jogo.gols_time1);
                    const gols2 = Number(jogo.gols_time2);

                    if (gols1 > 0 || gols2 > 0) {
                        resultado.textContent = `${gols1} x ${gols2}`;
                    } else {
                        resultado.textContent = "A definir";
                    }

                    linha.appendChild(rodada);
                    linha.appendChild(confronto);
                    linha.appendChild(data);
                    linha.appendChild(horario);
                    linha.appendChild(resultado);

                    tabela.appendChild(linha);
                });

            } catch (erro) {

                console.error("Erro ao carregar jogos:", erro);

                tabela.innerHTML = `
                    <tr>
                        <td colspan="5">
                            Não foi possível carregar os jogos.
                        </td>
                    </tr>
                `;
            }
        }

        carregarJogos();
    </script>

</body>
</html>
