
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Futsal - InterHub</title>
    <link rel="stylesheet" href="/style.css">

    <style>
        .jogos-lista {
            display: grid;
            gap: 15px;
        }

        .jogo-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .08);
            border-left: 5px solid #fca311;
        }

        .confronto {
            font-size: 18px;
            font-weight: bold;
            color: #1b263b;
            text-align: center;
        }

        .detalhes {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            color: #555;
        }

        .placar {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #fca311;
            margin: 12px 0;
        }

        .status {
            font-weight: bold;
        }

        .finalizado {
            color: #16803c;
        }

        .agendado {
            color: #a66b00;
        }

        .mensagem {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            background: #fca311;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            color: black;
        }
    </style>
</head>

<body>

    <header>
        <h1>Interclasse 2026</h1>
        <span>Escola Exército Brasileiro</span>
    </header>
    <a href="/index.html" class="botao-inicio">🏠 Início</a>
    <section class="hero">
        <h2>⚽ FUTSAL</h2>
        <p>Jogos da modalidade</p>
    </section>

    <section class="container">

        <div class="highlight">
            <h2>Jogos de Futsal</h2>

            <div class="jogos-lista" id="lista-jogos">
                <p class="mensagem">Carregando jogos...</p>
            </div>

            <a href="jogos.html" class="voltar">⬅ Voltar</a>
        </div>

    </section>

    <footer>
        Equipe 3°C
    </footer>

    <script>
        async function carregarJogos() {

            const lista = document.getElementById("lista-jogos");

            try {

                const resposta = await fetch("/api/jogos?modalidade=Futsal");

                if (!resposta.ok) {
                    throw new Error("Não foi possível carregar os jogos.");
                }

                const jogos = await resposta.json();

                lista.innerHTML = "";

                if (jogos.length === 0) {
                    lista.innerHTML = `
                        <p class="mensagem">
                            Nenhum jogo de Futsal cadastrado ainda.
                        </p>
                    `;
                    return;
                }

                jogos.forEach(jogo => {

                    const card = document.createElement("div");
                    card.classList.add("jogo-card");

                    const confronto = document.createElement("div");
                    confronto.classList.add("confronto");
                    confronto.textContent = `${jogo.time1} x ${jogo.time2}`;

                    const status = jogo.status || "Agendado";

                    const placar = document.createElement("div");
                    placar.classList.add("placar");

                    if (status === "Finalizado") {
                        placar.textContent =
                            `${jogo.gols_time1} x ${jogo.gols_time2}`;
                    } else {
                        placar.textContent = "Aguardando resultado";
                    }

                    const data = jogo.data_jogo
                        ? String(jogo.data_jogo)
                            .split("T")[0]
                            .split("-")
                            .reverse()
                            .join("/")
                        : "A definir";

                    const horario = jogo.horario
                        ? String(jogo.horario).slice(0, 5)
                        : "A definir";

                    const detalhes = document.createElement("div");
                    detalhes.classList.add("detalhes");

                    const dataHorario = document.createElement("span");
                    dataHorario.textContent = `📅 ${data} | 🕒 ${horario}`;

                    const situacao = document.createElement("span");
                    situacao.classList.add("status");
                    situacao.classList.add(
                        status === "Finalizado" ? "finalizado" : "agendado"
                    );
                    situacao.textContent = status;

                    detalhes.appendChild(dataHorario);
                    detalhes.appendChild(situacao);

                    card.appendChild(confronto);
                    card.appendChild(placar);
                    card.appendChild(detalhes);

                    lista.appendChild(card);

                });

            } catch (erro) {

                console.error("Erro ao carregar jogos:", erro);

                lista.innerHTML = `
                    <p class="mensagem">
                        Erro ao carregar os jogos de Futsal.
                    </p>
                `;
            }
        }

        carregarJogos();

        setInterval(() => {
            if (!document.hidden) {
                carregarJogos();
            }
        }, 10000);
    </script>

</body>
</html>
