<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<title>Painel Administrativo</title>

<link rel="stylesheet" href="/admin.css">

</head>

<body>

<header>

    <div class="logo">
        InterHub Admin
    </div>

    <div>
        Área Administrativa
    </div>

</header>

<div class="admin-container">

    <div class="cards">

        <div class="card">
            <h2>⚽ Jogos</h2>
            <p>Cadastrar e editar partidas</p>
        </div>

        <div class="card">
            <h2>🏆 Classificação</h2>
            <p>Atualizar ranking dos times</p>
        </div>

        <div class="card">
            <h2>📋 Times</h2>
            <p>Gerenciar equipes</p>
        </div>

        <div class="card">
            <h2>📅 Tabela</h2>
            <p>Organizar confrontos</p>
        </div>

        <div class="card">
            <h2>📊 Estatísticas</h2>
            <p>Ver dados do campeonato</p>
        </div>

        <div class="card logout"
             onclick="window.location.href='/logout'">

            <h2>🚪 Sair</h2>
            <p>Encerrar sessão</p>

        </div>

    </div>

</div>

</body>
</html>
